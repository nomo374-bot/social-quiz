<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>董軾社會 - 自主學習與錯題系統</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="questions.js"></script>
    <style>
        :root { 
            --color-1: #0b1d26; --color-2: #076d7d; --color-3: #1399a3; --color-4: #97d9c4; 
            --color-5: #ece2c1; --color-6: #f29f05; --color-7: #d97904; --color-8: #bf5b04; 
            --color-9: #a63f03; --color-10: #8c1c03;
            --primary: var(--color-2); --accent: var(--color-9); --success: #27ae60; --bg: #fdfaf2; 
        }

        body { font-family: "PingFang TC", "Microsoft JhengHei", sans-serif; background: var(--bg); color: var(--color-1); margin: 0; padding: 10px; line-height: 1.6; min-height: 100vh; display: flex; flex-direction: column; }
        .container { max-width: 800px; margin: 0 auto; background: #fff; border-radius: 20px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.1); flex: 1; }
        
        .top-banner { 
            width: 100%; height: auto; aspect-ratio: 16 / 9;
            background: url('https://i.postimg.cc/0yCgKVxQ/Chat_GPT_Image_2025年3月31日_上午04_14_34.png') center 20% / cover no-repeat; 
            background-color: var(--color-1); 
        }

        .profile-section { padding: 25px; background: var(--color-5); text-align: center; border-bottom: 5px solid var(--color-4); }
        .profile-links { display: flex; justify-content: center; align-items: center; flex-wrap: wrap; gap: 20px; margin-top: 20px; }
        .profile-links a { color: var(--color-1); text-decoration: none; font-size: 26px; transition: 0.3s; }
        .profile-links a:hover { color: var(--color-2); transform: translateY(-3px); }
        .coffee-btn { background: #FFDD00; color: #000 !important; padding: 8px 18px; border-radius: 50px; font-size: 15px !important; font-weight: bold; display: flex; align-items: center; gap: 8px; text-decoration: none; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        
        .header { background: var(--color-1); color: #fff; padding: 20px; display: flex; justify-content: space-between; align-items: center; }
        .header h2 { margin: 0; font-size: 24px; letter-spacing: 2px; }

        .content-body { padding: 25px; }
        .hidden { display: none; }
        
        .setup-box { background: #fdfdfd; border: 2px solid var(--color-4); padding: 25px; border-radius: 15px; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 8px; color: var(--color-2); }
        select, input { width: 100%; padding: 12px; border: 2px solid var(--color-5); border-radius: 10px; font-size: 16px; outline: none; box-sizing: border-box; }
        
        .btn-main { width: 100%; padding: 15px; background: var(--color-2); color: white; border: none; border-radius: 10px; font-size: 18px; cursor: pointer; transition: 0.3s; font-weight: bold; }
        .btn-main:hover { background: var(--color-3); }
        .btn-row { display: flex; gap: 12px; margin-top: 12px; }
        .btn-row .btn-main { flex: 1; font-size: 16px; }
        .btn-mistake { background: var(--color-8); }
        .btn-fav { background: var(--color-3); }

        .float-home { position: fixed; bottom: 30px; right: 20px; width: 60px; height: 60px; background: var(--color-1); color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; text-decoration: none; box-shadow: 0 4px 15px rgba(0,0,0,0.3); z-index: 99; transition: 0.3s; border: 2px solid #fff; }
        .float-home:hover { transform: scale(1.1); background: var(--color-2); }

        .quiz-card { position: relative; border: 2px solid var(--color-5); padding: 25px; border-radius: 15px; margin-bottom: 25px; background: #fff; }
        .fav-icon { position: absolute; right: 20px; top: 20px; cursor: pointer; width: 28px; height: 28px; }
        .fav-icon path { fill: none; stroke: #ccc; stroke-width: 2; }
        .fav-icon.active path { fill: var(--color-10); stroke: var(--color-10); }
        .analysis { display: none; margin-top: 15px; padding: 15px; background: var(--color-5); border-radius: 10px; border-left: 5px solid var(--color-6); }
        .option-btn { display: block; width: 100%; text-align: left; padding: 14px; margin: 10px 0; border: 2px solid var(--color-5); border-radius: 10px; background: #fff; cursor: pointer; font-size: 16px; transition: 0.2s; }
        .option-btn:hover { background: var(--color-5); }
        img { max-width: 100%; border-radius: 10px; margin: 15px 0; }

        footer { text-align: center; padding: 40px 20px; color: var(--color-1); font-size: 13px; }
        .footer-links { margin-bottom: 10px; }
        .footer-links a { color: var(--color-2); text-decoration: none; margin: 0 10px; font-weight: bold; }
        .copyright { opacity: 0.7; font-size: 12px; }

        #privacy-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: none; justify-content: center; align-items: center; z-index: 1000; padding: 20px; }
        .modal-content { background: white; padding: 30px; border-radius: 20px; max-width: 600px; max-height: 85vh; overflow-y: auto; position: relative; font-size: 14px; text-align: left; }
        .close-modal { position: absolute; right: 20px; top: 20px; font-size: 24px; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <div class="top-banner"></div>
    <div class="profile-section">
        <h3 style="margin:0; color: var(--color-10);">董軾社會 Geography Tung</h3>
        <p style="margin:5px 0 15px 0; font-size: 14px;">致力於社會科教學與數位題庫開發</p>
        <div class="profile-links">
            <a href="https://buymeacoffee.com/nomo374" target="_blank" class="coffee-btn"><i class="fa-solid fa-mug-hot"></i> 支持維運</a>
            <a href="https://www.tiktok.com/@kuanlintung3" target="_blank"><i class="fa-brands fa-tiktok"></i></a>
            <a href="https://www.instagram.com/grantung/" target="_blank"><i class="fa-brands fa-instagram"></i></a>
            <a href="https://www.facebook.com/grantung1993/?locale=zh_TW" target="_blank"><i class="fa-brands fa-facebook"></i></a>
            <a href="https://www.youtube.com/@geographytung360" target="_blank"><i class="fa-brands fa-youtube"></i></a>
            <a href="https://medium.com/@nomo374" target="_blank"><i class="fa-brands fa-medium"></i></a>
        </div>
    </div>

    <div class="header">
        <h2>自主學習系統</h2>
        <div id="user-info"></div>
    </div>

    <div class="content-body">
        <div id="login-view" style="text-align: center; padding: 40px 0;">
            <p>歡迎使用！請先登入以同步您的紀錄</p>
            <button onclick="login()" class="btn-main" style="background: #4285F4; max-width: 280px;"><i class="fa-brands fa-google"></i> Google 帳號登入</button>
        </div>

        <div id="setup-view" class="hidden">
            <div class="setup-box">
                <div class="form-group">
                    <label><i class="fa-solid fa-book"></i> 選擇科目</label>
                    <select id="sub-select" onchange="refreshChapters()">
                        <option value="H">歷史</option>
                        <option value="G">地理</option>
                        <option value="C">公民</option>
                    </select>
                </div>
                <div class="form-group">
                    <label><i class="fa-solid fa-layer-group"></i> 選擇單元</label>
                    <select id="chap-select"></select>
                </div>
                <div class="form-group">
                    <label><i class="fa-solid fa-list-ol"></i> 挑選題數</label>
                    <select id="count-select">
                        <option value="5">5 題</option>
                        <option value="10">10 題</option>
                        <option value="20" selected>20 題</option>
                        <option value="50">50 題</option>
                    </select>
                </div>
                <button class="btn-main" onclick="startTest()"><i class="fa-solid fa-play"></i> 開始測驗</button>
                <div class="btn-row">
                    <button class="btn-main btn-fav" onclick="showFavorites()"><i class="fa-solid fa-bookmark"></i> 我的收藏</button>
                    <button class="btn-main btn-mistake" onclick="showMistakes()"><i class="fa-solid fa-circle-xmark"></i> 錯題本</button>
                </div>
            </div>
        </div>

        <div id="quiz-view" class="hidden">
            <div id="quiz-content"></div>
        </div>
    </div>
</div>

<a href="javascript:location.reload()" class="float-home" title="返回首頁">
    <i class="fa-solid fa-house-chimney fa-2x"></i>
</a>

<footer>
    <div class="footer-links">
        <a href="javascript:void(0)" onclick="togglePrivacy(true)">個資保護宣告</a>
        <a href="mailto:nomo374@gmail.com?subject=董軾社會系統建議">聯繫我們 (Gmail)</a>
    </div>
    <div class="copyright">
        &copy; 2026 董軾社會 Geography Tung. All Rights Reserved.
    </div>
</footer>

<div id="privacy-modal">
    <div class="modal-content">
        <span class="close-modal" onclick="togglePrivacy(false)">&times;</span>
        <h2 style="color: var(--color-2);">個資保護宣告</h2>
        <p>您的學習軌跡僅用於個人錯題複習，請安心使用。</p>
        <button class="btn-main" onclick="togglePrivacy(false)">同意並進入</button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, doc, getDoc, setDoc, updateDoc, arrayUnion, arrayRemove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDyLtHX57VSyp8Y0uyCmx6uE--QOrBbNW8",
        authDomain: "question-bank-3aae2.firebaseapp.com",
        projectId: "question-bank-3aae2",
        storageBucket: "question-bank-3aae2.firebasestorage.app",
        messagingSenderId: "692164298143",
        appId: "1:692164298143:web:439cebfe20a3847e09a9aa",
        measurementId: "G-CFQE6N3CS6"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();
    let currentUser = null;
    let userBookmarks = []; 
    let userMistakes = [];  

    window.togglePrivacy = (show) => document.getElementById('privacy-modal').style.display = show ? 'flex' : 'none';
    window.login = () => signInWithPopup(auth, provider).catch(err => alert("登入取消或失敗"));

    onAuthStateChanged(auth, async (user) => {
        if (user) {
            currentUser = user;
            document.getElementById('login-view').classList.add('hidden');
            document.getElementById('setup-view').classList.remove('hidden');
            document.getElementById('user-info').innerHTML = `<small>您好, ${user.displayName}</small>`;
            const userRef = doc(db, "users", user.uid);
            const snap = await getDoc(userRef);
            if (snap.exists()) {
                const data = snap.data();
                userBookmarks = data.bookmarks || [];
                userMistakes = data.mistakes || [];
            } else {
                await setDoc(userRef, { bookmarks: [], mistakes: [] });
            }
            window.refreshChapters();
        }
    });

    window.refreshChapters = () => {
        const sub = document.getElementById('sub-select').value;
        const chapSelect = document.getElementById('chap-select');
        chapSelect.innerHTML = '<option value="ALL">全部範圍</option>';
        const stats = {};
        if (typeof fullQuestionBank !== 'undefined') {
            fullQuestionBank.filter(q => q.sub === sub).forEach(q => {
                if (q.chap) stats[q.chap] = (stats[q.chap] || 0) + 1;
            });
            for (const [name, count] of Object.entries(stats)) {
                const opt = document.createElement('option');
                opt.value = name; opt.textContent = `${name} (${count} 題)`;
                chapSelect.appendChild(opt);
            }
        }
    };

    window.startTest = () => {
        const sub = document.getElementById('sub-select').value;
        const chap = document.getElementById('chap-select').value;
        const count = parseInt(document.getElementById('count-select').value);
        let pool = fullQuestionBank.filter(q => q.sub === sub && (chap === 'ALL' || q.chap === chap) && q.type !== 'group_question');
        pool.sort(() => Math.random() - 0.5);
        renderDisplay("📖 練習模式", pool.slice(0, count));
    };

    window.showFavorites = () => {
        if (userBookmarks.length === 0) return alert("您的收藏夾是空的喔！");
        const pool = fullQuestionBank.filter(q => userBookmarks.includes(q.id));
        renderDisplay("🔖 我的收藏", pool);
    };

    window.showMistakes = () => {
        if (userMistakes.length === 0) return alert("目前沒有錯題紀錄！");
        const pool = fullQuestionBank.filter(q => userMistakes.includes(q.id));
        renderDisplay("❌ 錯題回顧", pool);
    };

    window.checkAns = async (qid, userSelect, correctAns) => {
        const card = document.getElementById(`card-${qid}`);
        const ana = document.getElementById(`ans-${qid}`);
        const optsDiv = document.getElementById(`options-${qid}`);
        ana.style.display = 'block';
        Array.from(optsDiv.getElementsByTagName('button')).forEach(b => b.disabled = true);
        if (userSelect == correctAns) {
            card.style.borderColor = "var(--success)";
        } else {
            card.style.borderColor = "var(--color-10)";
            if (!userMistakes.includes(qid)) {
                userMistakes.push(qid);
                await updateDoc(doc(db, "users", currentUser.uid), { mistakes: arrayUnion(qid) }).catch(()=>{});
            }
        }
    };

    window.toggleFav = async (qid) => {
        if (!currentUser) return alert("請先登入");
        const icon = document.getElementById(`fav-${qid}`);
        const userRef = doc(db, "users", currentUser.uid);
        if (userBookmarks.includes(qid)) {
            userBookmarks = userBookmarks.filter(id => id !== qid);
            icon.classList.remove('active');
            await updateDoc(userRef, { bookmarks: arrayRemove(qid) });
        } else {
            userBookmarks.push(qid);
            icon.classList.add('active');
            await updateDoc(userRef, { bookmarks: arrayUnion(qid) });
        }
    };

    function renderDisplay(title, questions) {
        const content = document.getElementById('quiz-content');
        document.getElementById('setup-view').classList.add('hidden');
        document.getElementById('quiz-view').classList.remove('hidden');
        content.innerHTML = `<h2>${title}</h2>`;
        questions.forEach(q => {
            const isFav = userBookmarks.includes(q.id) ? 'active' : '';
            content.innerHTML += `
                <div class="quiz-card" id="card-${q.id}">
                    <svg class="fav-icon ${isFav}" id="fav-${q.id}" onclick="toggleFav('${q.id}')" viewBox="0 0 24 24"><path d="M5 3H19C20.1 3 21 3.9 21 5V21L12 17.25L3 21V5C3 3.9 3.9 3 5 3Z" /></svg>
                    <p><b>[${q.chap || '單元'}]</b> ${q.q}</p>
                    ${q.img ? `<img src="${q.img}">` : ''}
                    <div id="options-${q.id}">${q.opts.map((o, i) => `<button class="option-btn" onclick="checkAns('${q.id}', ${i+1}, ${q.ans})">${o}</button>`).join('')}</div>
                    <div id="ans-${q.id}" class="analysis"><b>正確答案 (${q.ans})：</b>${q.analysis || '目前無解析'}</div>
                </div>`;
        });
        window.scrollTo(0,0);
    }
</script>
</body>
</html>
